$kind: http-request
name: POST /api/orders/:id/shipping-address
description: "Quyền: bidder. Chi tiết: docs/api.md mục 10."
url: "{{base_url}}/api/orders/{{order_id}}/shipping-address"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "addressId": "{{address_id}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{token_bidder}}"
order: 4000
