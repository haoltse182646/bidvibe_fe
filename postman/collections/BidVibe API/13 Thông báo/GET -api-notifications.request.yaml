$kind: http-request
name: GET /api/notifications
description: "Quyền: bidder, seller. Chi tiết: docs/api.md mục 15."
url: "{{base_url}}/api/notifications?limit=20"
method: GET
headers:
  Content-Type: application/json
queryParams:
  limit: "20"
auth:
  type: bearer
  credentials:
    token: "{{token_bidder}}"
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j.success && j.data.notifications.length) pm.environment.set("notification_id", j.data.notifications[0].id);
    language: text/javascript
order: 1000
