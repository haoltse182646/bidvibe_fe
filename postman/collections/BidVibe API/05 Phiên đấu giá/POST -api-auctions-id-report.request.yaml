$kind: http-request
name: POST /api/auctions/:id/report
description: "Quyền: bidder. Chi tiết: docs/api.md mục 7."
url: "{{base_url}}/api/auctions/{{auction_id}}/report"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Nghi đẩy giá",
      "note": "Hai tài khoản đặt xen kẽ"
    }
auth:
  type: bearer
  credentials:
    token: "{{token_bidder}}"
order: 3000
