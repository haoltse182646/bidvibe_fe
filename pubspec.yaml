name: bidvibe
description: BidVibe — prototype Flutter app cho nền tảng đấu giá trực tuyến thời gian thực (dữ liệu giả lập, chưa nối backend).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  intl: ^0.19.0
  provider: ^6.1.2

  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^3.1.6
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - config/dev.json